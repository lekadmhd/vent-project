name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build all apps
        run: npm run build

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            if [ ! -d "${{ secrets.APP_DIR }}/.git" ]; then
              git clone git@github.com:lekadmhd/vent-project.git ${{ secrets.APP_DIR }}
            fi
            cd ${{ secrets.APP_DIR }}
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            npm ci || npm install
            npm run build
            bash database/bootstrap_vps.sh
            if [ ! -f apps/api/.env ]; then
              cp apps/api/.env.example apps/api/.env
              echo "WARNING: API .env created from template on VPS"
            fi
            echo "NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_HOST }}:5000/api" > apps/web/.env.local
            echo "NEXT_PUBLIC_API_URL=http://${{ secrets.VPS_HOST }}:5000/api" > apps/admin/.env.local
            restart_or_start() {
              local name="$1" script="$2" cwd="$3" port="$4"
              if pm2 describe "$name" >/dev/null 2>&1; then
                pm2 restart "$name" --update-env
              else
                pm2 start "$script" --name "$name" --cwd "$cwd" -- start -p "$port"
              fi
            }
            restart_or_start aptrent-api apps/api/dist/main.js apps/api 5000
            restart_or_start aptrent-web node_modules/.bin/next apps/web 3000
            restart_or_start aptrent-admin node_modules/.bin/next apps/admin 3001
            pm2 save
