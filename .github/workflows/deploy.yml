name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            ensure_swap() {
              local existing
              existing=$(free -m | awk '/Swap:/{print $2}')
              if [ "$existing" -lt 1024 ]; then
                echo "Adding swapfile (current: ${existing}MB)..."
                local path="/swapfile-$RANDOM"
                fallocate -l 4G "$path" 2>/dev/null || dd if=/dev/zero of="$path" bs=1M count=4096 status=none
                chmod 600 "$path"
                mkswap "$path" >/dev/null
                swapon "$path"
                echo "$path none swap sw 0 0" >> /etc/fstab
                sysctl -w vm.swappiness=10 >/dev/null
              fi
              echo "Swap: $(free -h | awk '/Swap:/{print $2}')"
            }
            ensure_swap
            export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=1024"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:lekadmhd/vent-project.git $APP_DIR
            fi
            cd $APP_DIR
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            npm install --no-audit --no-fund
            echo "NEXT_PUBLIC_API_URL=https://api.piraku.net/api" > apps/web/.env.local
            echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}" >> apps/web/.env.local
            echo "NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ vars.CLOUDINARY_UPLOAD_PRESET }}" >> apps/web/.env.local
            echo "NEXT_PUBLIC_API_URL=https://api.piraku.net/api" > apps/admin/.env.local
            echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}" >> apps/admin/.env.local
            echo "NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ vars.CLOUDINARY_UPLOAD_PRESET }}" >> apps/admin/.env.local
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
            echo "Changed files: $CHANGED"
            if [ -z "$CHANGED" ]; then CHANGED="all"; fi
            NEED_API=false
            NEED_FE=false
            echo "$CHANGED" | grep -qE "^apps/api/|^package(-lock)?\.json$" && NEED_API=true
            echo "$CHANGED" | grep -qE "^apps/(web|admin)/|^package(-lock)?\.json$" && NEED_FE=true
            if [ "$CHANGED" = "all" ]; then NEED_API=true; NEED_FE=true; fi
            echo "Build API: $NEED_API | Build FE: $NEED_FE"
            if [ "$NEED_API" = true ]; then npm run build --workspace @aptrent/api; fi
            if [ "$NEED_FE" = true ]; then npm run build --workspace @aptrent/web; fi
            if [ "$NEED_FE" = true ]; then npm run build --workspace @aptrent/admin; fi
            bash database/bootstrap_vps.sh
            if [ ! -f apps/api/.env ]; then
              cp apps/api/.env.example apps/api/.env
              echo "WARNING: API .env created from template on VPS"
            fi
            pm2 delete vent-project 2>/dev/null || true
            restart_or_start() {
              local name="$1" script="$2" cwd="$3" port="$4"
              pm2 delete "$name" 2>/dev/null || true
              pm2 start "$script" --name "$name" --cwd "$cwd" --max-memory-restart 300M -- start -p "$port"
            }
            restart_or_start aptrent-api "$APP_DIR/apps/api/dist/main.js" "$APP_DIR/apps/api" 5000
            restart_or_start aptrent-web "$APP_DIR/node_modules/.bin/next" "$APP_DIR/apps/web" 3000
            restart_or_start aptrent-admin "$APP_DIR/node_modules/.bin/next" "$APP_DIR/apps/admin" 3001
            pm2 save
