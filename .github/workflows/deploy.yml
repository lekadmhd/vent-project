name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build API
        run: npm run build

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ ! -d "${{ secrets.APP_DIR }}/.git" ]; then
              git clone git@github.com:lekadmhd/vent-project.git ${{ secrets.APP_DIR }}
            fi
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            npm ci || npm install
            npm run build
            if [ ! -f apps/api/.env ]; then
              cp apps/api/.env.example apps/api/.env
              echo "WARNING: .env created from template on VPS"
            fi
            if pm2 describe aptrent-api >/dev/null 2>&1; then
              pm2 restart aptrent-api --update-env
            else
              pm2 start apps/api/dist/main.js --name aptrent-api --cwd apps/api
            fi
            pm2 save
